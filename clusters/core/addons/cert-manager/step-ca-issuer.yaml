# Certificates for *.blt.lab.ethos.home from the lab's step-ca, over ACME.
# step-ca checks each request by fetching a token from the name over plain
# HTTP (HTTP-01), served by a short-lived solver behind Traefik - so the CA
# must reach the Traefik address (192.168.51.20) on port 80. No CA
# credential is kept in the cluster; the issuer's ACME account key is.
#
# caBundle is the public "Ethos Home Root CA" (ethos-home-root-ca.crt,
# SHA-256 fingerprint add773292fc4822a01f8da53f59f89965913d60cfbf092bb3f43f6ec84a3c40d,
# checked on the CA itself), so cert-manager trusts the CA's own HTTPS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    server: https://ca.lab.ethos.home/acme/acme/directory
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
