# Installed by RKE2's Helm controller when this file is in
# /var/lib/rancher/rke2/server/manifests (scripts/install-rke2-server.sh puts it there).
# No version: the chart's latest at install time. Pin it (spec.version) once installed.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: longhorn
  namespace: kube-system
spec:
  repo: https://charts.longhorn.io
  chart: longhorn
  targetNamespace: longhorn-system
  createNamespace: true
  valuesContent: |-
    defaultSettings:
      defaultReplicaCount: 3
