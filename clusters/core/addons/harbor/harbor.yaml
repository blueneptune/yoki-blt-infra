# Harbor 2.15.2 (chart 1.19.2), installed by RKE2's helm controller like
# the cluster's other add-ons: registry.blt.lab.ethos.home, through
# Traefik, certificate from step-ca. Secrets first:
# scripts/harbor-secrets.sh. See docs/harbor.md.
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: harbor
  namespace: kube-system
spec:
  repo: https://helm.goharbor.io
  chart: harbor
  version: 1.19.2
  targetNamespace: harbor
  valuesContent: |-
    externalURL: https://registry.blt.lab.ethos.home
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      ingress:
        className: traefik
        hosts:
          core: registry.blt.lab.ethos.home
        annotations:
          cert-manager.io/cluster-issuer: step-ca
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Volumes are ReadWriteOnce: a new pod cannot start before the old
    # one lets go of them.
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry: {storageClass: longhorn-two, size: 40Gi}
        jobservice:
          jobLog: {storageClass: longhorn-two, size: 1Gi}
        database: {storageClass: longhorn-two, size: 5Gi}
        redis: {storageClass: longhorn-two, size: 1Gi}
        trivy: {storageClass: longhorn-two, size: 5Gi}
    # Generated by scripts/harbor-secrets.sh, never in this file.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: harbor-secret-key
    trivy:
      enabled: true
