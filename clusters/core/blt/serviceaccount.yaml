# Every pod in blt that does not name a service account - the apps here,
# and later the Prefect flow-run pods - pulls from Harbor with the "pull"
# robot. The Secret is made by scripts/harbor-blt-project.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: blt
imagePullSecrets:
  - name: harbor-pull
