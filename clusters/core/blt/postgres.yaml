# blt's Postgres: three instances (one primary, two streaming replicas)
# managed by CloudNativePG, one per node. Holds two databases:
#   blt      blt's own data, owned by role blt (password: secret blt-pg-app,
#            created by the operator)
#   prefect  the Prefect server's, owned by role prefect (password: secret
#            blt-pg-prefect, created by scripts/postgres-secrets.sh)
# Services: blt-pg-rw (the primary - what applications use), blt-pg-ro.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: blt-pg
  namespace: blt
spec:
  instances: 3
  # Same major version as the podman stack it replaces, so moving the
  # data is a plain dump and restore.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  storage:
    storageClass: longhorn-single
    # 20Gi filled on 2026-11-11 (see postgresql.parameters): 30Gi also
    # gives the full primary room to start again. Grown in place
    # (resizeInUseVolumes, Longhorn expands online); never shrunk.
    size: 30Gi
  postgresql:
    parameters:
      # A replica that stops streaming keeps its replication slot, and
      # the slot keeps every WAL segment since - with archive_timeout
      # (5min) that is 16MB every 5 minutes even when idle. Unbounded,
      # that filled the primary's 20Gi in four days and took it down
      # (2026-11-07 to 11-11). Past 4GB the slot is dropped instead and
      # that replica is re-cloned; the primary stays up.
      max_slot_wal_keep_size: "4GB"
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: blt
      owner: blt
  managed:
    roles:
      - name: prefect
        ensure: present
        login: true
        passwordSecret:
          name: blt-pg-prefect
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: blt-pg-prefect
  namespace: blt
spec:
  cluster:
    name: blt-pg
  name: prefect
  owner: prefect
