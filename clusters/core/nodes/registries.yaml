# /etc/rancher/rke2/registries.yaml on every core server: containerd trusts
# the lab root CA for Harbor. RKE2 turns this into certs.d/<host>/hosts.toml
# when it starts; scripts/node-trust.sh also writes that file so the trust
# works at once, without restarting RKE2.
configs:
  "registry.blt.lab.ethos.home":
    tls:
      ca_file: /etc/rancher/rke2/ethos-home-root-ca.crt
